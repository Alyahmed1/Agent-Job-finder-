# Job Finder Agent: your search profile.
# 1) Copy this file to profile.yaml (it is git-ignored, so your real details stay private).
# 2) Replace everything marked  <-- EDIT  with your own information.
# If profile.yaml is missing, the project falls back to this example.

name: Your Name                    # <-- EDIT: your full name (used to sign your cover notes)
gmail: you@gmail.com               # <-- EDIT: the inbox that receives your LinkedIn job alerts

roles: []                          # <-- EDIT: the job titles you want. Replace [] with one per line, each starting with "- " (for example "- Backend Developer")

work_types: []                     # <-- EDIT: remote, on-site, or both, written like [remote, on-site]

locations:
  priority: Egypt                  # your home country: its jobs get their own first tab and rank first
  # home_cities: [germany, berlin, munich]   # <-- EDIT only if your home is not Egypt: lowercase words that appear in its job locations
  on_site: [Egypt]
  relocation: [Canada, United Arab Emirates, Saudi Arabia, Europe]
  remote: worldwide                # no rank, search everywhere

summary: ""                        # <-- EDIT: 1 to 2 sentences about you as a candidate: your field and what you build, inside the quotes

skills: {}                         # <-- EDIT: your own skills, grouped any way you like. Replace {} with lines such as "  languages: [Python]"

experience_level: ""               # <-- EDIT: entry-to-junior, mid, or senior, inside the quotes

scoring:
  top_n: 10

# Ranking by job title, first match wins. Edit keywords or points freely.
priority_tiers:
  - name: "Tier 1: AI / ML / GenAI"
    points: 70
    needs_role: true     # "AI" alone is not enough: title must also be an engineering/science role
    demote:              # keep in Tier 1, but near the bottom of it (example: you are not into Linux)
      keywords: ['linux']
      cap: 64
      label: "Linux (not preferred)"
    keywords: ['machine learning', '\bml\b', '\bai\b', 'gen ?ai', 'generative', '\bllm', '\bnlp\b', 'deep learning', 'computer vision', 'artificial intelligence', '\bagent(ic|s)?\b', 'mlops', 'llmops', 'prompt engineer']
  - name: "Tier 2: Backend / Full Stack / Data / Mobile / Web / Deploy"
    points: 62           # a small gap to Tier 1 so the two ranks mix near the top
    needs_role: true
    keywords: ['back[- ]?end', 'full[- ]?stack', 'data engineer', 'mobile', 'flutter', '(android|ios) ', 'web ?(developer|engineer)', 'website', 'devops', 'cloud (engineer|developer)', 'deploy']
  - name: "Tier 3: Software Engineer"
    points: 40
    keywords: ['software (engineer|developer)']
no_match_points: 10
role_words: 'engineer|developer|develop|scientist|researcher|programmer|architect|specialist|analyst|intern|trainee'
off_target_words: 'designer|design\b|sales|marketing|recruit|support|technician|account manager|infrastructure|factory|network|hardware|data cent|content|writer|instructor|trainer|teacher'
adjustments:
  egypt: 10          # Egypt priority
  junior: 10         # junior / graduate / early career
  senior: -10        # senior / lead / principal / staff (softened, still worth a look)
  management: -25    # manager / director / head (not a hands-on role)
  stack_mismatch: -15  # .NET, Odoo, ServiceNow, SAP, PHP, Laravel, Salesforce
  off_target: -30    # design, sales, support, infrastructure/deployment...

# Remote-job websites (Remotive, Remote OK, We Work Remotely, Jobicy, Himalayas, Working Nomads)
feeds:
  min_score: 40            # only keep remote jobs that match your roles (LinkedIn alert jobs are always kept)
  regions_ok: [worldwide, anywhere, global, emea, africa, middle east, mena, egypt]   # no "USA only" jobs
  search_terms: [machine learning, generative AI, AI engineer, LLM, backend, data engineer, full stack, python]  # Jobicy + Himalayas
  cooldown_hours:          # Remotive asks for at most ~4 requests a day
    Remotive: 6
    Remote OK: 3
    We Work Remotely: 3
    Jobicy: 6
    Himalayas: 6
    Working Nomads: 6      # no official terms published, so we stay gentle

# Cover note button (free local model). The model may only use the facts below, so it cannot invent experience.
cover_note:
  model: qwen2.5:3b                # any model you have installed in Ollama
  always_mention:                  # <-- EDIT: one project you want EVERY cover note to name (leave both empty to skip this)
    name: ""                       #     its short name, inside the quotes
    sentence: ""                   #     one true sentence about it; it is added automatically if the model forgets to mention it
  facts: []                        # <-- EDIT: replace [] with 4 to 8 TRUE facts about yourself, one per line, each starting with "- "
    # Tips: start each fact with WORK or PERSONAL PROJECT so the model never mixes them up.
    #       Be specific: what you built, with which tools, and what it did. For example:
    #   - "WORK (Company A, current internship): what you built, with which tools."
    #   - "PERSONAL PROJECT (not for an employer): built <project>, a short description."

# Safety net: when you open the dashboard and the list is older than this, it updates itself once.
auto_refresh_hours: 12
